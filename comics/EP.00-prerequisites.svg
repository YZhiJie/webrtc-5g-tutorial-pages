<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.00</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">浏览器安全模型那道坎</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">霓虹墨 NEON INK · webrtc-5g-tutorial</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 面板 1 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：getUserMedia 被拒</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#f97316"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="312" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">双击 html 打开，浏览器提示</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">"NotAllowedError: Permission denied"</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 标签君的首份 WebRTC 代码</text>
    <text x="38" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">navigator.mediaDevices.getUserMedia({ video: true })</text>
    <text x="38" y="214" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">  .then(stream => video.srcObject = stream)</text>
    <text x="38" y="234" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">  .catch(e => console.log(e.name))</text>
    <text x="38" y="254" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// NotAllowedError ❌</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f97316"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">file:// 协议 = 非安全上下文 = WebRTC API 被屏蔽</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">这是浏览器的安全设计，不是 bug。</text>
  </g>

  <!-- 面板 2 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="400,0 480,0 80,361 0,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：安全上下文规则</text>
    <g transform="translate(52,110)">
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-14 L-6,-5 L0,-16 L6,-5 L11,-14 L16,-2 Q0,-11 -16,-2 Z" fill="#f8fafc" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="300" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">码叔：浏览器只信任两种来源</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">HTTPS / localhost</text>
    <rect x="24" y="152" width="524" height="178" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="13.5" fill="#e2e8f0">✅ 安全上下文（isSecureContext = true）</text>
    <text x="52" y="198" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">https://example.com</text>
    <text x="52" y="218" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">http://localhost:3000</text>
    <text x="52" y="238" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">http://127.0.0.1:8080</text>
    <text x="38" y="266" font-size="13.5" fill="#f472b6">❌ 非安全上下文</text>
    <text x="52" y="290" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">file:///Users/xxx/demo.html</text>
    <text x="52" y="310" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">http://192.168.1.100（同网段非 localhost）</text>
  </g>

  <!-- 面板 3 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="100,0 30,0 500,361 570,361" fill="#34d399" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：一条命令启动开发服务器</text>
    <rect x="24" y="60" width="524" height="200" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="38" y="84" font-size="13.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ cd my-webrtc-demo</text>
    <text x="38" y="106" font-size="13.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ npx serve .</text>
    <text x="38" y="134" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">   ┌─────────────────────────────────┐</text>
    <text x="38" y="154" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">   │  Serving!                       │</text>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">   │  Local:   http://localhost:3000 │</text>
    <text x="38" y="194" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">   └─────────────────────────────────┘</text>
    <text x="38" y="226" font-size="13.5" fill="#e2e8f0">打开浏览器控制台验证：</text>
    <text x="38" y="248" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&gt; window.isSecureContext  // true ✅</text>
    <text x="38" y="268" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&gt; typeof RTCPeerConnection // "function" ✅</text>
    <text x="38" y="288" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">&gt; navigator.mediaDevices.getUserMedia  // ✅ 可用</text>
    <g transform="translate(400,80)">
      <circle cx="0" cy="0" r="28" fill="#34d399" opacity="0.2"/>
      <text x="0" y="6" text-anchor="middle" font-size="24" font-weight="bold" fill="#34d399">OK</text>
    </g>
  </g>

  <!-- 面板 4 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="480,0 572,0 120,361 0,361" fill="#f97316" opacity="0.05"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：三道门槛一次过</text>
    <g transform="translate(52,95)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#f8fafc" stroke="#223055" stroke-width="1.5"/>
      <circle cx="0" cy="-2" r="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,85 74,91 88,97" fill="#f8fafc"/>
    <rect x="88" y="67" width="380" height="74" rx="10" fill="#f8fafc"/>
    <text x="102" y="90" font-size="15" fill="#0b1220">码叔：记住 WebRTC 学前必过的三道门：</text>
    <text x="102" y="113" font-size="15" fill="#0b1220">① HTTPS ② ES6 异步 ③ WebSocket 信令</text>
    <text x="102" y="134" font-size="15" fill="#0b1220">过了这三关，后面的 API 才能正常用。</text>
    <rect x="24" y="152" width="524" height="178" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="34" y="162" width="62" height="22" rx="5" fill="#f97316"/>
    <text x="65" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <text x="38" y="204" font-size="13" fill="#f472b6">1. 部署到服务器忘了 HTTPS</text>
    <text x="52" y="226" font-size="12.5" fill="#94a3b8">—— Let's Encrypt 免费证书 / Cloudflare 一键 HTTPS</text>
    <text x="38" y="252" font-size="13" fill="#f472b6">2. Chrome 升级后 getUserMedia 报错</text>
    <text x="52" y="274" font-size="12.5" fill="#94a3b8">—— 先确认地址栏是不是 http:// 而不是 https://</text>
    <text x="38" y="300" font-size="13" fill="#f472b6">3. 手机同网段连不上</text>
    <text x="52" y="322" font-size="12.5" fill="#94a3b8">—— 手机的 http:// 非 localhost 视为非安全，用内网穿透或 HTTPS</text>
  </g>

  <text x="1180" y="826" text-anchor="end" font-size="11" fill="#475569">NEON INK · webrtc-5g-tutorial · EP.00</text>
</svg>
