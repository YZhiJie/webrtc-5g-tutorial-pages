<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#a78bfa" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.16</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">UDP 之上的握手与加密</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">霓虹墨 NEON INK · webrtc-5g-tutorial</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 面板 1 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：RTP 全是乱码</text>
    <!-- 标签君头像 -->
    <g transform="translate(52,104)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-6,17 L6,17 L5,27 L0,30 L-5,27 Z" fill="#f97316"/>
      <text x="0" y="26" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">5</text>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,94 74,100 88,106" fill="#f8fafc"/>
    <rect x="88" y="76" width="400" height="70" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">标签君：抓包看自研 Demo 流量，</text>
    <text x="102" y="120" font-size="15" fill="#0b1220">RTP 头能认，payload 全乱码……</text>
    <text x="102" y="140" font-size="15" fill="#0b1220">我发的明明是 hello，被劫持了？</text>
    <rect x="24" y="160" width="524" height="108" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="182" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// Wireshark · Demo 的 RTP 流量</text>
    <text x="38" y="204" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">80 60 12 34 aa bb cc dd   ← RTP 头:明文</text>
    <text x="38" y="226" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">9f 3c 7a e1 04 d8 b2 66   ← payload:乱码?</text>
    <text x="38" y="248" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 'hello' 变随机字节, 末尾还多 10B</text>
    <rect x="24" y="282" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="282" width="4" height="50" rx="2" fill="#a78bfa"/>
    <text x="40" y="303" font-size="13.5" fill="#e2e8f0">没被劫持——WebRTC 强制加密，payload 是密文</text>
    <text x="40" y="323" font-size="13.5" fill="#94a3b8">看不懂，只是因为还没握手协商出那把密钥</text>
  </g>

  <!-- 面板 2 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="400,0 480,0 80,361 0,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：DTLS 握手协商</text>
    <!-- 码叔头像 -->
    <g transform="translate(52,104)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="17" fill="#ffd9b3"/>
      <path d="M-17,-3 Q-13,-19 0,-20 Q13,-19 17,-3 Q8,-10 0,-10 Q-8,-10 -17,-3 Z" fill="#f1f5f9"/>
      <path d="M-5,9 Q0,17 5,9 Q0,12 -5,9 Z" fill="#f1f5f9"/>
      <circle cx="-5.5" cy="-1" r="3.6" fill="none" stroke="#0b1220" stroke-width="1.1"/>
      <circle cx="5.5" cy="-1" r="3.6" fill="none" stroke="#0b1220" stroke-width="1.1"/>
      <line x1="-1.9" y1="-1" x2="1.9" y2="-1" stroke="#0b1220" stroke-width="1.1"/>
      <circle cx="-5.5" cy="-1" r="1.2" fill="#0b1220"/>
      <circle cx="5.5" cy="-1" r="1.2" fill="#0b1220"/>
      <path d="M-3,6 q3,2.5 6,0" stroke="#0b1220" stroke-width="1.2" fill="none"/>
    </g>
    <polygon points="88,94 74,100 88,106" fill="#f8fafc"/>
    <rect x="88" y="76" width="420" height="70" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">码叔：DTLS = UDP 上的 TLS，</text>
    <text x="102" y="120" font-size="15" fill="#0b1220">握手导出密钥，灌给 SRTP——</text>
    <text x="102" y="140" font-size="15" fill="#0b1220">AES-CM 加密 + HMAC-SHA1 认证</text>
    <rect x="24" y="158" width="524" height="138" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="180" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 简化握手时序（RFC 6347 / 5764）</text>
    <text x="38" y="201" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">C ── ClientHello ──────────▶ S</text>
    <text x="38" y="222" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">C ◀── HelloVerifyRequest+cookie ── S</text>
    <text x="38" y="243" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">C ── ClientHello+cookie ───▶ S</text>
    <text x="38" y="264" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">C ◀── ServerHello/Cert ⇄ ECDHE ── S</text>
    <text x="38" y="286" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">key = export(EXTRACTOR-dtls_srtp)</text>
    <rect x="24" y="308" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="308" width="4" height="44" rx="2" fill="#a78bfa"/>
    <text x="40" y="327" font-size="13.5" fill="#e2e8f0">cookie 防 DoS 放大；证书指纹走 SDP</text>
    <text x="40" y="345" font-size="13.5" fill="#94a3b8">a=fingerprint 带外比对，代替 CA 体系</text>
  </g>

  <!-- 面板 3 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="100,0 30,0 500,361 570,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：Node.js 加解密</text>
    <!-- 像素酱头像 -->
    <g transform="translate(52,98)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#a78bfa"/>
      <text x="0" y="29" text-anchor="middle" font-size="9" font-weight="bold" fill="#0b1220">{}</text>
      <circle cx="0" cy="-2" r="17" fill="#ffd9b3"/>
      <path d="M-16,-5 Q-9,-19 0,-20 Q11,-19 16,-5 Q8,-11 0,-11 Q-8,-11 -16,-5 Z" fill="#22d3ee"/>
      <path d="M13,-9 Q25,-2 19,13 Q23,0 11,-4 Z" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,3.5 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,88 74,94 88,100" fill="#f8fafc"/>
    <rect x="88" y="70" width="400" height="50" rx="10" fill="#f8fafc"/>
    <text x="102" y="92" font-size="15" fill="#0b1220">像素酱：模拟 ECDHE 握手 → 对指纹</text>
    <text x="102" y="112" font-size="15" fill="#0b1220">→ SRTP protect / unprotect 跑一遍</text>
    <rect x="24" y="134" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="156" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// dtls-srtp-sim.js 运行输出</text>
    <text x="38" y="178" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">fingerprint ✅ == SDP a=fingerprint</text>
    <text x="38" y="200" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">master key 导出: EXTRACTOR-dtls_srtp</text>
    <text x="38" y="222" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">send: 'hello'(5B) → srtp.protect()</text>
    <text x="38" y="244" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">recv: unprotect ✅ → 'hello' 还原</text>
    <rect x="24" y="276" width="524" height="62" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="276" width="4" height="62" rx="2" fill="#a78bfa"/>
    <text x="40" y="298" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">wire: 80 60 … 9f 3c 7a e1 04 ‖ tag(10B)</text>
    <text x="40" y="320" font-size="13.5" fill="#e2e8f0">头明文 + payload 密文 + 10B 认证标签 ✅</text>
  </g>

  <!-- 面板 4 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="480,0 572,0 120,361 0,361" fill="#f97316" opacity="0.05"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：加密三牢记</text>
    <!-- 码叔头像 -->
    <g transform="translate(52,100)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="17" fill="#ffd9b3"/>
      <path d="M-17,-3 Q-13,-19 0,-20 Q13,-19 17,-3 Q8,-10 0,-10 Q-8,-10 -17,-3 Z" fill="#f1f5f9"/>
      <path d="M-5,9 Q0,17 5,9 Q0,12 -5,9 Z" fill="#f1f5f9"/>
      <circle cx="-5.5" cy="-1" r="3.6" fill="none" stroke="#0b1220" stroke-width="1.1"/>
      <circle cx="5.5" cy="-1" r="3.6" fill="none" stroke="#0b1220" stroke-width="1.1"/>
      <line x1="-1.9" y1="-1" x2="1.9" y2="-1" stroke="#0b1220" stroke-width="1.1"/>
      <circle cx="-5.5" cy="-1" r="1.2" fill="#0b1220"/>
      <circle cx="5.5" cy="-1" r="1.2" fill="#0b1220"/>
      <path d="M-3,6 q3,2.5 6,0" stroke="#0b1220" stroke-width="1.2" fill="none"/>
    </g>
    <polygon points="88,90 74,96 88,102" fill="#f8fafc"/>
    <rect x="88" y="72" width="420" height="68" rx="10" fill="#f8fafc"/>
    <text x="102" y="94" font-size="15" fill="#0b1220">码叔：手写栈收官——DTLS 管握手，</text>
    <text x="102" y="116" font-size="15" fill="#0b1220">SRTP 管加密，指纹校验是</text>
    <text x="102" y="136" font-size="15" fill="#0b1220">整条信任链的锚。</text>
    <rect x="24" y="152" width="524" height="182" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="34" y="162" width="62" height="22" rx="5" fill="#f97316"/>
    <text x="65" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <text x="38" y="204" font-size="13" fill="#f472b6">1. 指纹不匹配 = 中间人</text>
    <text x="52" y="226" font-size="12.5" fill="#94a3b8">a=fingerprint 走信令带外比对，信令信道必须 TLS</text>
    <text x="38" y="252" font-size="13" fill="#f472b6">2. 顺序不能反：先验签再解密</text>
    <text x="52" y="274" font-size="12.5" fill="#94a3b8">verify-then-decrypt，反了就是 padding oracle 入口</text>
    <text x="38" y="300" font-size="13" fill="#f472b6">3. auth tag 别乱截 32-bit</text>
    <text x="52" y="322" font-size="12.5" fill="#94a3b8">80-bit 伪造概率 2⁻⁸⁰；截 32-bit 只剩 2⁻³²，慎用</text>
  </g>

  <text x="1180" y="826" text-anchor="end" font-size="11" fill="#475569">NEON INK · webrtc-5g-tutorial · EP.16</text>
</svg>
