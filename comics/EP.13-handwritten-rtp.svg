<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#f97316" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.13</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">给每个 UDP 包编上号</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">霓虹墨 NEON INK · webrtc-5g-tutorial</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 面板 1 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：UDP 包又乱又丢</text>
    <!-- 标签君（橙刺猬头 + 蓝外套） -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#f97316"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="66" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">标签君：自研推流用 UDP 直发，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">包不按顺序到，还老丢几个……</text>
    <text x="102" y="146" font-size="14" fill="#f472b6">画面花屏 + 声音跳帧，UDP 太不可靠了！</text>
    <rect x="24" y="162" width="524" height="100" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="184" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 发送顺序：[1] [2] [3] [4] [5] [6]</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 接收顺序：[1] [3] [?] [2] [6] [?]</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 乱序：[2] 跑到 [3] 后面；丢包：[4] [5] 没到</text>
    <text x="38" y="248" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 解码器拿到 [3] 时缺 [2] 的参考帧 → 花屏</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f97316"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">UDP 不保证顺序、不保证到达、不保证不重——</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">实时音视频必须在它上面自己盖一层"编号 + 时间戳"</text>
  </g>

  <!-- 面板 2 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="400,0 480,0 80,361 0,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：RTP 12 字节头</text>
    <!-- 码叔（白发 + 圆眼镜 + 灰大褂） -->
    <g transform="translate(52,100)">
      <circle cx="0" cy="-2" r="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,92 74,98 88,104" fill="#f8fafc"/>
    <rect x="88" y="74" width="420" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="96" font-size="15" fill="#0b1220">码叔：RTP 在 UDP payload 前面</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">塞 12 字节头，把"顺序 + 时机"补回来</text>
    <rect x="24" y="150" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="172" font-size="13" fill="#22d3ee">RTP 固定头（12 字节，RFC 3550）：</text>
    <text x="52" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">0        1        2        3</text>
    <text x="52" y="212" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">V=2 P X CC  M   PT   sequence</text>
    <text x="52" y="230" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">timestamp (32 bit)</text>
    <text x="52" y="248" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">SSRC (32 bit 同步源标识)</text>
    <text x="38" y="272" font-size="13" fill="#a78bfa">seq 与 ts 的分工：</text>
    <text x="52" y="294" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">sequence：每发一包 +1 → 检测丢包 / 重排</text>
    <text x="52" y="314" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">timestamp：媒体采样时刻 → 控制播放节奏 / 音画同步</text>
  </g>

  <!-- 面板 3 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="100,0 30,0 500,361 570,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：手写打包 + 统计</text>
    <!-- 像素酱（青高马尾 + 紫卫衣） -->
    <g transform="translate(52,110)">
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#22d3ee"/>
      <path d="M-16,-6 Q-22,-2 -16,2 M-14,-8 Q-14,-16 -6,-16 M6,-16 Q14,-16 14,-8" stroke="#22d3ee" stroke-width="3" fill="none"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">像素酱：Node.js 给每帧 opus</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">打上 seq + ts，顺手算丢包和 jitter</text>
    <rect x="24" y="150" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="172" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 打包：12 字节头 + opus 负载</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const hdr = Buffer.alloc(12)</text>
    <text x="38" y="212" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">hdr[0] = 0x80; hdr[1] = 96  // V=2, PT=96</text>
    <text x="38" y="232" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">hdr.writeUInt16BE(seq++, 2)</text>
    <text x="38" y="252" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">hdr.writeUInt32BE(ts, 4); ts += 960 // 20ms@48k</text>
    <text x="38" y="272" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">hdr.writeUInt32BE(ssrc, 8)</text>
    <text x="38" y="292" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 80 60 12 34 aa bb cc dd 11 22 33 44 ...</text>
    <text x="38" y="312" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// RTCP RR：丢包率 3.2%，jitter 8ms</text>
  </g>

  <!-- 面板 4 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="480,0 572,0 120,361 0,361" fill="#f97316" opacity="0.05"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：编号三铁律</text>
    <!-- 码叔 -->
    <g transform="translate(52,95)">
      <circle cx="0" cy="-2" r="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,85 74,91 88,97" fill="#f8fafc"/>
    <rect x="88" y="67" width="420" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="90" font-size="15" fill="#0b1220">码叔：手写 RTP 记住一句话——</text>
    <text x="102" y="112" font-size="15" fill="#0b1220">seq 管顺序、ts 管时机、RTCP 管反馈</text>
    <rect x="24" y="152" width="524" height="178" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="34" y="162" width="62" height="22" rx="5" fill="#f97316"/>
    <text x="65" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <text x="38" y="204" font-size="13" fill="#f472b6">1. seq 是 uint16，会回绕</text>
    <text x="52" y="226" font-size="12.5" fill="#94a3b8">65535 → 0，比较时用 (a - b) &amp; 0xFFFF，别直接比大小</text>
    <text x="38" y="252" font-size="13" fill="#f472b6">2. timestamp 用采样时钟不是墙钟</text>
    <text x="52" y="274" font-size="12.5" fill="#94a3b8">视频 90kHz、opus 48kHz，随机起点防嗅探，别从 0 开始</text>
    <text x="38" y="300" font-size="13" fill="#f472b6">3. RTCP 复合包最小 28 字节</text>
    <text x="52" y="322" font-size="12.5" fill="#94a3b8">SR/RR 必须跟 SDES CNAME 一起发，单独发会被中间盒丢</text>
  </g>

  <text x="1180" y="826" text-anchor="end" font-size="11" fill="#475569">NEON INK · webrtc-5g-tutorial · EP.13</text>
</svg>
