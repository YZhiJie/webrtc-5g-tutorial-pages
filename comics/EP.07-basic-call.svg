<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#34d399" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.07</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">两个标签页的握手日记</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">霓虹墨 NEON INK · webrtc-5g-tutorial</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 面板 1 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：点了接听画面不出</text>
    <!-- 标签君头像 -->
    <g transform="translate(52,100)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#f97316"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,92 74,98 88,104" fill="#f8fafc"/>
    <rect x="88" y="74" width="360" height="62" rx="10" fill="#f8fafc"/>
    <text x="102" y="96" font-size="15" fill="#0b1220">标签君：A 标签页开了摄像头，</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">B 标签页点了接听……</text>
    <text x="102" y="138" font-size="15" fill="#0b1220">B 页一片黑，没有远端画面</text>
    <!-- 问题代码 -->
    <rect x="24" y="150" width="524" height="140" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="172" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 标签君的代码（哪里错了？）</text>
    <text x="38" y="194" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// ① 采集 ✅</text>
    <text x="38" y="214" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const stream = await navigator.mediaDevices.getUserMedia({video:true});</text>
    <text x="38" y="234" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// ② 忘了 addTrack ❌</text>
    <text x="38" y="254" font-size="12" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">const offer = await pc.createOffer();</text>
    <text x="38" y="274" font-size="12" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">await pc.setLocalDescription(offer);</text>
    <text x="38" y="294" font-size="12" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">bc.postMessage({type:'offer', sdp: offer});</text>
    <rect x="24" y="302" width="524" height="36" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="36" rx="2" fill="#22d3ee"/>
    <text x="40" y="326" font-size="13.5" fill="#e2e8f0">—— 没 addTrack，SDP 里就没有 media section，</text>
  </g>

  <!-- 面板 2 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="400,0 480,0 80,361 0,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：最小闭环 8 步</text>
    <!-- 码叔头像 -->
    <g transform="translate(52,100)">
      <circle cx="0" cy="-2" r="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,92 74,98 88,104" fill="#f8fafc"/>
    <rect x="88" y="74" width="340" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="96" font-size="15" fill="#0b1220">码叔：完整闭环，一步都不能少：</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">少了 addTrack = 全链路白搭</text>
    <rect x="24" y="146" width="524" height="196" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">caller 侧（A 标签页）：</text>
    <text x="48" y="190" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">① const stream = await getUserMedia({video:true})</text>
    <text x="48" y="210" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">② stream.getTracks().forEach(t =&gt; pc.addTrack(t, stream))</text>
    <text x="48" y="230" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">③ const offer = await pc.createOffer()</text>
    <text x="48" y="250" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">④ await pc.setLocalDescription(offer)</text>
    <text x="48" y="270" font-size="12" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">⑤ bc.postMessage({type:'offer', sdp: offer})   ← 信令</text>
    <text x="38" y="294" font-size="12.5" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">callee 侧（B 标签页）：</text>
    <text x="48" y="314" font-size="12" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">⑥ await pc.setRemoteDescription(offer)</text>
    <text x="48" y="334" font-size="12" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">⑦ const ans = await pc.createAnswer()</text>
  </g>

  <!-- 面板 3 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="100,0 30,0 500,361 570,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：getStats 看连接状态</text>
    <rect x="24" y="60" width="524" height="290" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="84" font-size="13.5" fill="#e2e8f0">正确闭环后，pc 的状态变化：</text>
    <!-- state timeline -->
    <text x="38" y="110" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">new ──&gt; have-local-offer ──&gt; stable ──&gt; connected ✅</text>
    <line x1="38" y1="116" x2="300" y2="116" stroke="#f472b6" stroke-width="2"/>
    <circle cx="38" cy="116" r="4" fill="#22d3ee"/>
    <circle cx="150" cy="116" r="4" fill="#fbbf24"/>
    <circle cx="250" cy="116" r="4" fill="#a78bfa"/>
    <circle cx="300" cy="116" r="4" fill="#34d399"/>
    <text x="310" y="120" font-size="11" fill="#34d399">ICE 连通</text>
    <!-- ontrack  -->
    <text x="38" y="148" font-size="13.5" fill="#34d399">on 'track' 事件才是远端画面的信号：</text>
    <text x="38" y="172" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">pc.ontrack = e =&gt; {</text>
    <text x="52" y="192" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  console.log('收到远端轨道', e.streams);</text>
    <text x="52" y="212" font-size="12" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  video.srcObject = e.streams[0];  // ← 画面出来了</text>
    <text x="38" y="232" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">};</text>
    <!-- getStats 验证 -->
    <text x="38" y="260" font-size="13.5" fill="#fbbf24">在 DevTools 验证：</text>
    <text x="38" y="284" font-size="12" fill="#64748b" font-family="'SF Mono',Consolas,monospace">&gt; pc.iceConnectionState</text>
    <text x="38" y="304" font-size="12" fill="#34d399" font-family="'SF Mono',Consolas,monospace">'connected'  ✅</text>
    <text x="38" y="324" font-size="12" fill="#64748b" font-family="'SF Mono',Consolas,monospace">&gt; pc.getSenders().length</text>
    <text x="38" y="344" font-size="12" fill="#34d399" font-family="'SF Mono',Consolas,monospace">2   // audio + video sender</text>
  </g>

  <!-- 面板 4 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="480,0 572,0 120,361 0,361" fill="#f97316" opacity="0.05"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：三条红线别碰</text>
    <!-- 像素酱头像 -->
    <g transform="translate(52,90)">
      <circle cx="0" cy="-2" r="17" fill="#ffd9b3"/>
      <path d="M-17,-2 Q-17,-18 -12,-17 L-8,-20 L-4,-18 L0,-19 L4,-18 L8,-20 L12,-17 Q17,-18 17,-2 Q0,-14 -17,-2 Z" fill="#22d3ee"/>
      <path d="M14,-6 L22,-8 L22,4 Q18,0 14,-4 Z" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,82 74,88 88,94" fill="#f8fafc"/>
    <rect x="88" y="64" width="420" height="66" rx="10" fill="#f8fafc"/>
    <text x="102" y="86" font-size="15" fill="#0b1220">像素酱：跑通了！</text>
    <text x="102" y="108" font-size="15" fill="#0b1220">但 BroadcastChannel 只是</text>
    <text x="102" y="128" font-size="15" fill="#0b1220">同一浏览器内的实验道具哦</text>
    <rect x="24" y="144" width="524" height="190" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="34" y="154" width="62" height="22" rx="5" fill="#f97316"/>
    <text x="65" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <text x="38" y="198" font-size="13" fill="#f472b6">1. 必须 HTTPS / localhost</text>
    <text x="52" y="220" font-size="12.5" fill="#94a3b8">—— file:// 直接屏蔽 RTCPeerConnection（EP.00 讲过的）</text>
    <text x="38" y="248" font-size="13" fill="#f472b6">2. 浏览器自动协商</text>
    <text x="52" y="270" font-size="12.5" fill="#94a3b8">—— 双方都要 addTrack，谁漏了谁黑屏</text>
    <text x="38" y="298" font-size="13" fill="#f472b6">3. BroadcastChannel ≠ 真 P2P</text>
    <text x="52" y="320" font-size="12.5" fill="#94a3b8">—— 只是本地消息传递。跨设备必须有信令服务器（WebSocket/Firebase）</text>
  </g>

  <text x="1180" y="826" text-anchor="end" font-size="11" fill="#475569">NEON INK · webrtc-5g-tutorial · EP.07</text>
</svg>
