<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.01</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">浏览器里藏着一整套 RTC 栈</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">霓虹墨 NEON INK · webrtc-5g-tutorial</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 面板 1 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：连麦为什么这么低延迟</text>
    <g transform="translate(52,110)">
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="350" height="66" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">标签君：抖音连麦 PK 延迟才</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">几百毫秒？我得自己写 UDP 吗？</text>
    <text x="102" y="146" font-size="14" fill="#f97316">（完全不知道 WebRTC 的存在）</text>
    <rect x="24" y="162" width="524" height="100" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="184" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 标签君以为自己要实现的：</text>
    <text x="38" y="206" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">1. 自己写 UDP 传输层</text>
    <text x="38" y="226" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">2. 自己实现 H264 编解码</text>
    <text x="38" y="246" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">3. 自己搞 NAT 穿透、加密、拥塞控制</text>
    <text x="38" y="264" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">// 这至少要一个 10 人团队干半年</text>
  </g>

  <!-- 面板 2 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：浏览器把整套 RTC 栈打包了</text>
    <rect x="24" y="60" width="524" height="260" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="84" font-size="13.5" fill="#22d3ee">┌─ 你的网页（只需写这三层 API）─┐</text>
    <text x="38" y="106" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">getUserMedia()</text>
    <text x="38" y="126" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">new RTCPeerConnection()</text>
    <text x="38" y="146" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">createDataChannel()</text>
    <text x="38" y="168" font-size="13.5" fill="#a78bfa">├─ 浏览器内核（自动帮你做）─┤</text>
    <text x="38" y="190" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">编码器 │ SRTP加密 │ ICE穿透 │ GCC拥塞</text>
    <text x="38" y="210" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">DTLS密钥 │ JitterBuffer │ RTP打包</text>
    <text x="38" y="232" font-size="13.5" fill="#34d399">├─ 操作系统 & 硬件 ──────────┤</text>
    <text x="38" y="254" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">摄像头驱动 │ GPU硬编 │ 网卡</text>
    <text x="38" y="284" font-size="13.5" fill="#e2e8f0">码叔：Google 2010 年花了</text>
    <text x="38" y="304" font-size="13.5" fill="#e2e8f0">几亿美金收购 GIPS RTC 技术</text>
    <text x="38" y="322" font-size="13.5" fill="#a78bfa">然后打包进了 Chrome——免费给你用</text>
  </g>

  <!-- 面板 3 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：5G vs 4G 延迟实测</text>
    <rect x="24" y="60" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="84" font-size="13.5" fill="#e2e8f0">WebRTC 端到端延迟：</text>
    <text x="38" y="108" font-size="13" fill="#64748b">4G LTE：</text>
    <rect x="100" y="96" width="180" height="14" rx="3" fill="#1e2a44"/>
    <rect x="100" y="96" width="108" height="14" rx="3" fill="#f97316"/>
    <text x="290" y="108" font-size="13" fill="#f97316">150~300ms</text>
    <text x="38" y="134" font-size="13" fill="#64748b">5G SA：</text>
    <rect x="100" y="122" width="180" height="14" rx="3" fill="#1e2a44"/>
    <rect x="100" y="122" width="54" height="14" rx="3" fill="#fbbf24"/>
    <text x="290" y="134" font-size="13" fill="#fbbf24">50~120ms</text>
    <text x="38" y="162" font-size="13" fill="#64748b">RTMP 直播：</text>
    <rect x="100" y="150" width="180" height="14" rx="3" fill="#1e2a44"/>
    <rect x="100" y="150" width="360" height="14" rx="3" fill="#a78bfa"/>
    <text x="290" y="162" font-size="13" fill="#a78bfa">1500~3000ms</text>
    <g transform="translate(380,70)">
      <g transform="translate(0,30)">
        <circle cx="0" cy="0" r="16" fill="#7C3AED"/>
        <text x="0" y="5" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">5G</text>
      </g>
    </g>
    <rect x="24" y="220" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="244" font-size="13.5" fill="#fbbf24">像素酱提问：5G URLLC 不是说能到 1ms 吗？</text>
    <text x="38" y="266" font-size="13" fill="#e2e8f0">码叔：1ms 是<strong>空口时延</strong>（基站→手机），</text>
    <text x="38" y="286" font-size="13" fill="#e2e8f0">端到端还要算编解码 + 转发 + 渲染</text>
    <text x="38" y="306" font-size="13" fill="#94a3b8">（1ms 真到端到端那是理想实验室条件）</text>
  </g>

  <!-- 面板 4 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：WebRTC + 5G = 直播互动最优解</text>
    <g transform="translate(52,95)">
      <circle cx="0" cy="-2" r="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,85 74,91 88,97" fill="#f8fafc"/>
    <rect x="88" y="67" width="400" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="90" font-size="15" fill="#0b1220">码叔总结三件事：</text>
    <text x="102" y="112" font-size="15" fill="#0b1220">① WebRTC 把整套 RTC 栈打包成了 JS API</text>
    <rect x="24" y="152" width="524" height="178" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <rect x="34" y="162" width="62" height="22" rx="5" fill="#f97316"/>
    <text x="65" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <text x="38" y="204" font-size="13" fill="#22d3ee">WebRTC ≠ 替代 RTMP</text>
    <text x="52" y="226" font-size="12.5" fill="#94a3b8">WebRTC 做互动，RTMP 做大规模分发</text>
    <text x="38" y="252" font-size="13" fill="#22d3ee">5G 1ms ≠ 端到端</text>
    <text x="52" y="274" font-size="12.5" fill="#94a3b8">那是空口时延，实际 50~120ms 端到端</text>
    <text x="38" y="300" font-size="13" fill="#22d3ee">何时用 WebRTC？</text>
    <text x="52" y="322" font-size="12.5" fill="#94a3b8">需要互动（双向/多向）的场景选它</text>
  </g>

  <text x="1180" y="826" text-anchor="end" font-size="11" fill="#475569">NEON INK · webrtc-5g-tutorial · EP.01</text>
</svg>
