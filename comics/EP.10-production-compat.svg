<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#34d399" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.10</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">兼容性矩阵那一张大表</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">霓虹墨 NEON INK · webrtc-5g-tutorial</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 面板 1 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#34d399" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：iOS Safari 和微信连不上</text>

    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#f97316"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="70" width="380" height="64" rx="10" fill="#f8fafc"/>
    <text x="102" y="92" font-size="15" fill="#0b1220">标签君上线了，结果：</text>
    <text x="102" y="114" font-size="15" fill="#f472b6">iOS Safari → 屏幕共享按钮灰了 🚫</text>
    <text x="102" y="134" font-size="14" fill="#f472b6">微信浏览器 → getUserMedia 直接 undefined</text>

    <rect x="24" y="148" width="524" height="116" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="172" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 标签君以为的"万能 API"</text>
    <text x="38" y="194" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">if (navigator.mediaDevices) { ... }</text>
    <text x="38" y="216" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 微信里 navigator.mediaDevices = undefined</text>
    <text x="38" y="236" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// iOS Safari 支持但 getDisplayMedia 有限</text>
    <text x="38" y="256" font-size="13" fill="#e2e8f0">老板：为什么我 iPhone 用不了？😡</text>
  </g>

  <!-- 面板 2 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="400,0 480,0 80,361 0,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：兼容性矩阵那张大表</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <circle cx="0" cy="-2" r="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="-5" cy="0" r="6" fill="none" stroke="#0b1220" stroke-width="1.2"/>
      <circle cx="5" cy="0" r="6" fill="none" stroke="#0b1220" stroke-width="1.2"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="44" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">码叔：每个平台都有自己的规矩</text>
    <text x="102" y="124" font-size="14" fill="#0b1220">不是你的代码错了，是平台说不行。</text>

    <!-- 兼容性小表格 -->
    <rect x="24" y="142" width="524" height="200" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>

    <!-- 表头 -->
    <rect x="34" y="152" width="200" height="24" fill="#1e2a44"/>
    <text x="44" y="169" font-size="12.5" fill="#e2e8f0" font-weight="bold">浏览器</text>
    <rect x="234" y="152" width="80" height="24" fill="#1e2a44"/>
    <text x="244" y="169" font-size="12.5" fill="#e2e8f0" font-weight="bold">getUserMedia</text>
    <rect x="314" y="152" width="90" height="24" fill="#1e2a44"/>
    <text x="324" y="169" font-size="12.5" fill="#e2e8f0" font-weight="bold">屏幕共享</text>
    <rect x="404" y="152" width="134" height="24" fill="#1e2a44"/>
    <text x="414" y="169" font-size="12.5" fill="#e2e8f0" font-weight="bold">PeerConnection</text>

    <!-- Chrome -->
    <rect x="34" y="176" width="200" height="24"/>
    <text x="44" y="193" font-size="12" fill="#7dd3fc">Chrome / Edge (桌面)</text>
    <text x="234" y="193" font-size="12" fill="#34d399">✅ 完整</text>
    <text x="314" y="193" font-size="12" fill="#34d399">✅ 完整</text>
    <text x="404" y="193" font-size="12" fill="#34d399">✅ 完整</text>

    <!-- Safari Mac -->
    <rect x="34" y="200" width="200" height="24" fill="#0e1730"/>
    <text x="44" y="217" font-size="12" fill="#7dd3fc">Safari (Mac)</text>
    <text x="234" y="217" font-size="12" fill="#fbbf24">⚠ 有限</text>
    <text x="314" y="217" font-size="12" fill="#fbbf24">⚠ 仅限窗口</text>
    <text x="404" y="217" font-size="12" fill="#34d399">✅ 可用</text>

    <!-- iOS Safari -->
    <rect x="34" y="224" width="200" height="24"/>
    <text x="44" y="241" font-size="12" fill="#7dd3fc">iOS Safari</text>
    <text x="234" y="241" font-size="12" fill="#34d399">✅ 可用</text>
    <text x="314" y="241" font-size="12" fill="#f472b6">❌ 无</text>
    <text x="404" y="241" font-size="12" fill="#fbbf24">⚠ 有限</text>

    <!-- 微信 -->
    <rect x="34" y="248" width="200" height="24" fill="#0e1730"/>
    <text x="44" y="265" font-size="12" fill="#7dd3fc">微信浏览器</text>
    <text x="234" y="265" font-size="12" fill="#f472b6">❌ API 屏蔽</text>
    <text x="314" y="265" font-size="12" fill="#f472b6">❌ 无</text>
    <text x="404" y="265" font-size="12" fill="#f472b6">❌ 不支持</text>

    <!-- Android Chrome -->
    <rect x="34" y="272" width="200" height="24"/>
    <text x="44" y="289" font-size="12" fill="#7dd3fc">Android Chrome</text>
    <text x="234" y="289" font-size="12" fill="#34d399">✅ 完整</text>
    <text x="314" y="289" font-size="12" fill="#fbbf24">⚠ 部分</text>
    <text x="404" y="289" font-size="12" fill="#34d399">✅ 完整</text>

    <!-- 注脚 -->
    <text x="34" y="320" font-size="12" fill="#64748b">⚠ 注意：微信内置浏览器完全屏蔽 WebRTC API，</text>
    <text x="34" y="338" font-size="12" fill="#64748b">需要引导用户跳转到系统浏览器或下载 App。</text>
  </g>

  <!-- 面板 3 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="100,0 30,0 500,361 570,361" fill="#fbbf24" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#fbbf24"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：弱网降级 + QoE 监控</text>

    <!-- 像素酱头像 -->
    <g transform="translate(52,95)">
      <circle cx="0" cy="-2" r="17" fill="#ffd9b3"/>
      <path d="M12,-8 Q24,0 18,12" fill="#22d3ee"/>
      <path d="M-16,-6 Q-8,-18 0,-20 Q10,-18 16,-6 Q0,-12 -16,-6 Z" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,85 74,91 88,97" fill="#f8fafc"/>
    <rect x="88" y="67" width="380" height="44" rx="10" fill="#f8fafc"/>
    <text x="102" y="90" font-size="15" fill="#0b1220">像素酱：WebRTC 不支持的用户怎么办？</text>
    <text x="102" y="110" font-size="14" fill="#0b1220">码叔：自动降级到 HLS 兜底。</text>

    <rect x="24" y="130" width="524" height="212" rx="8" fill="#0a0f1c" stroke="#fbbf24" stroke-opacity="0.35"/>
    <text x="38" y="154" font-size="13.5" fill="#fbbf24">// 客户端降级策略</text>
    <text x="38" y="176" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const webrtcOK = RTCPeerConnection</text>
    <text x="38" y="196" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  &amp;&amp; navigator.mediaDevices</text>
    <text x="38" y="218" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">if (webrtcOK) {</text>
    <text x="52" y="238" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  initWebRTC(); // 互动模式</text>
    <text x="38" y="260" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">} else {</text>
    <text x="52" y="280" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">  initHLS(); // 纯观看兜底（延迟高但兼容）</text>
    <text x="38" y="302" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="326" font-size="13" fill="#e2e8f0">// QoE 监控面板（实时上报）</text>
  </g>

  <!-- 面板 4 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="480,0 572,0 120,361 0,361" fill="#f97316" opacity="0.05"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：生产环境先测矩阵再上线</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,95)">
      <circle cx="0" cy="-2" r="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="-5" cy="0" r="6" fill="none" stroke="#0b1220" stroke-width="1.2"/>
      <circle cx="5" cy="0" r="6" fill="none" stroke="#0b1220" stroke-width="1.2"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,85 74,91 88,97" fill="#f8fafc"/>
    <rect x="88" y="67" width="420" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="90" font-size="15" fill="#0b1220">码叔：兼容性不是可选项——</text>
    <text x="102" y="112" font-size="15" fill="#0b1220">上线前把目标平台测一遍。</text>

    <rect x="24" y="145" width="524" height="190" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="34" y="155" width="62" height="22" rx="5" fill="#f97316"/>
    <text x="65" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">⚠ 坑点</text>

    <text x="38" y="196" font-size="13" fill="#f472b6">1. Safari 编解码器限制</text>
    <text x="52" y="218" font-size="12.5" fill="#94a3b8">—— Safari 不支持 VP8/VP9 硬编，iOS 上只能 H264</text>
    <text x="52" y="236" font-size="12.5" fill="#94a3b8">—— SFU 要做 VP9→H264 转码给 Safari 用户（额外成本）</text>

    <text x="38" y="260" font-size="13" fill="#f472b6">2. iOS 后台暂停</text>
    <text x="52" y="282" font-size="12.5" fill="#94a3b8">—— iOS Safari 切后台 10s 后 PeerConnection 被系统挂起</text>
    <text x="52" y="300" font-size="12.5" fill="#94a3b8">—— 回前台要重新协商 Offer/Answer</text>

    <text x="38" y="322" font-size="13" fill="#f472b6">3. 合规隐私（权限弹窗）</text>
    <text x="52" y="344" font-size="12.5" fill="#94a3b8">—— 中国 App 要按工信部要求做隐私协议弹窗</text>
    <text x="52" y="362" font-size="12.5" fill="#94a3b8">—— getDisplayMedia 必须先弹权限说明</text>
  </g>

  <text x="1180" y="826" text-anchor="end" font-size="11" fill="#475569">NEON INK · webrtc-5g-tutorial · EP.10</text>
</svg>
