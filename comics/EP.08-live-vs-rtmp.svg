<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#f472b6" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.08</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">WebRTC 直播 vs 传统 RTMP</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">霓虹墨 NEON INK · webrtc-5g-tutorial</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 面板 1 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：纯观看 10w + 要连麦互动</text>

    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#f97316"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,-4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="70" width="380" height="64" rx="10" fill="#f8fafc"/>
    <text x="102" y="92" font-size="15" fill="#0b1220">标签君：电商直播用 RTMP 推 CDN</text>
    <text x="102" y="114" font-size="15" fill="#0b1220">10w 并发没问题，但老板要加连麦 PK！</text>
    <text x="102" y="134" font-size="14" fill="#f472b6">RTMP 根本做不到双向互动…</text>

    <rect x="24" y="148" width="524" height="116" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="13" fill="#e2e8f0">现有架构（只能单向）：</text>
    <text x="38" y="194" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">主播 ──RTMP──▶ 推流服务器 ──▶ CDN ──▶ 10w 观众</text>
    <text x="38" y="222" font-size="13" fill="#fbbf24">❌ 连麦观众怎么进这条链路？</text>
    <text x="38" y="244" font-size="12.5" fill="#64748b">RTMP 是单向推送协议，没有"拉流回去"</text>
    <text x="38" y="264" font-size="12.5" fill="#64748b">的设计。HLS 延迟 3~10s 连麦根本没法用。</text>
  </g>

  <!-- 面板 2 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="400,0 480,0 80,361 0,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：三种架构对比</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <circle cx="0" cy="-2" r="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
      <!-- 圆框眼镜 -->
      <circle cx="-5" cy="0" r="6" fill="none" stroke="#0b1220" stroke-width="1.2"/>
      <circle cx="5" cy="0" r="6" fill="none" stroke="#0b1220" stroke-width="1.2"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="360" height="44" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">码叔：三条路，看业务选</text>
    <text x="102" y="124" font-size="14" fill="#0b1220">没有银弹，只有取舍。</text>

    <!-- 三种架构对比 -->
    <rect x="24" y="142" width="524" height="200" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="164" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">┌─ 方案 A：纯 RTMP ──────────┐</text>
    <text x="52" y="184" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">主播▶RTMP▶CDN▶观众</text>
    <text x="52" y="202" font-size="12" fill="#64748b" font-family="'SF Mono',Consolas,monospace">延迟 3s+ | 互动 ❌ | 成本低</text>

    <text x="38" y="226" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">├─ 方案 B：WebRTC + SFU ─────┤</text>
    <text x="52" y="246" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">主播▶WebRTC▶SFU◀WebRTC◀连麦</text>
    <text x="52" y="264" font-size="12" fill="#64748b" font-family="'SF Mono',Consolas,monospace">延迟 100ms | 互动 ✅ | 成本中</text>

    <text x="38" y="288" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">└─ 方案 C：混合架构（推荐）─┘</text>
    <text x="52" y="308" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">主播▶WebRTC▶SFU─ffmpeg转推RTMP▶CDN</text>
    <text x="52" y="326" font-size="12" fill="#34d399" font-family="'SF Mono',Consolas,monospace">连麦走 WebRTC | 10w 观众走 CDN</text>
  </g>

  <!-- 面板 3 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="100,0 30,0 500,361 570,361" fill="#34d399" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：Mediasoup SFU + ffmpeg 转推</text>

    <rect x="24" y="60" width="524" height="278" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="38" y="84" font-size="13.5" fill="#34d399">// SFU 端（Mediasoup Worker）</text>
    <text x="38" y="106" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">await router.createTransport({ listen: { port: 443 } })</text>
    <text x="38" y="126" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const producer = await transport.produce({ track, simulcast: true })</text>
    <text x="38" y="148" font-size="13.5" fill="#fbbf24">// 转推到 RTMP CDN（ffmpeg 子进程）</text>
    <text x="38" y="170" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">ffmpeg -i mediasoup://localhost:443/stream</text>
    <text x="52" y="190" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">  -c:v copy -c:a aac</text>
    <text x="52" y="210" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">  -f flv rtmp://cdn.example.com/live/key</text>
    <text x="38" y="238" font-size="13.5" fill="#e2e8f0">// 完整链路</text>
    <text x="38" y="262" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">主播 ─WebRTC─▶ SFU (Mediasoup)</text>
    <text x="68" y="282" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">├─WebRTC▶ 连麦观众（~100ms）</text>
    <text x="68" y="302" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">└─ffmpeg转推▶ RTMP▶ CDN▶ 10w 观众（~3s）</text>
  </g>

  <!-- 面板 4 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="480,0 572,0 120,361 0,361" fill="#f97316" opacity="0.05"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：WebRTC + RTMP 混合架构才是王道</text>

    <!-- 像素酱头像 -->
    <g transform="translate(52,95)">
      <circle cx="0" cy="-2" r="17" fill="#ffd9b3"/>
      <!-- 马尾 -->
      <path d="M12,-8 Q24,0 18,12" fill="#22d3ee"/>
      <!-- 头发刘海 -->
      <path d="M-16,-6 Q-8,-18 0,-20 Q10,-18 16,-6 Q0,-12 -16,-6 Z" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.8" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.8" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,85 74,91 88,97" fill="#f8fafc"/>
    <rect x="88" y="67" width="420" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="90" font-size="15" fill="#0b1220">像素酱：所以 WebRTC 和 RTMP 不是竞争关系？</text>
    <text x="102" y="112" font-size="15" fill="#0b1220">码叔：对，分工不同，一个做互动一个做分发。</text>

    <rect x="24" y="145" width="524" height="190" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="34" y="155" width="62" height="22" rx="5" fill="#f97316"/>
    <text x="65" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">⚠ 坑点</text>

    <text x="38" y="196" font-size="13" fill="#f472b6">1. SFU 不是万能的</text>
    <text x="52" y="218" font-size="12.5" fill="#94a3b8">—— SFU 成本 ≈ 每并发 ~50kbps 上行，1w 并发就要 500Mbps</text>
    <text x="52" y="236" font-size="12.5" fill="#94a3b8">—— 纯观看用 RTMP/CDN，别硬上 WebRTC</text>

    <text x="38" y="260" font-size="13" fill="#f472b6">2. Simulcast 是 SFU 必需</text>
    <text x="52" y="282" font-size="12.5" fill="#94a3b8">—— SFU 要给不同观众发不同码率层级（180p/360p/720p）</text>
    <text x="52" y="300" font-size="12.5" fill="#94a3b8">—— 编码器不开 simulcast = SFU 只能硬转码 = CPU 炸</text>

    <text x="38" y="322" font-size="13" fill="#f472b6">3. TURN 成本要算</text>
    <text x="52" y="344" font-size="12.5" fill="#94a3b8">—— 20%~30% 用户会走 TURN（对称 NAT），流量全走你服务器</text>
  </g>

  <text x="1180" y="826" text-anchor="end" font-size="11" fill="#475569">NEON INK · webrtc-5g-tutorial · EP.08</text>
</svg>
