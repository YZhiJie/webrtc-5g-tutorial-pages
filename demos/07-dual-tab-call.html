<!DOCTYPE html>
<html>
<head><title>WebRTC 一对一 Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
  .videos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  video { width: 100%; height: 300px; background: #000; border-radius: 8px; object-fit: cover; }
  .controls { margin: 16px 0; }
  button { padding: 8px 16px; margin-right: 8px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; }
  .status { font-family: monospace; background: #f5f5f5; padding: 10px; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>

<h2>🎥 WebRTC 一对一通话 Demo</h2>
<div class="videos">
  <div>
    <p>本端</p>
    <video id="local" autoplay playsinline muted></video>
  </div>
  <div>
    <p>远端</p>
    <video id="remote" autoplay playsinline></video>
  </div>
</div>

<div class="controls">
  <button id="btn-start">📷 开启摄像头</button>
  <button id="btn-call">📞 发起通话（A 标签页点）</button>
  <button id="btn-answer">✅ 接听（B 标签页点）</button>
  <button id="btn-hangup">⏹️ 挂断</button>
</div>
<div class="status" id="status">等待开启...</div>

<script>
const localVideo = document.getElementById('local')
const remoteVideo = document.getElementById('remote')
const statusEl = document.getElementById('status')

const bc = new BroadcastChannel('webrtc-demo')  // 跨标签页信令
const pc = new RTCPeerConnection({
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
  ]
})

let localStream = null

function log(msg) { statusEl.textContent += '\n' + msg; console.log(msg) }

// ========== 开启摄像头 ==========
document.getElementById('btn-start').onclick = async () => {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
  localVideo.srcObject = localStream

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream))
  log('✅ 摄像头已开启')

  pc.addEventListener('track', (e) => {
    remoteVideo.srcObject = e.streams[0]
    log('🎥 收到远端视频流')
  })

  pc.addEventListener('iceconnectionstatechange', () => {
    log('🔗 ICE 状态: ' + pc.iceConnectionState)
  })
}

// ========== 信令转发 ==========
pc.addEventListener('icecandidate', (e) => {
  if (e.candidate) bc.postMessage({ type: 'ice', candidate: e.candidate })
})

bc.onmessage = async (evt) => {
  const msg = evt.data
  log('📨 收到消息: ' + msg.type)

  if (msg.type === 'offer') {
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp))
  }
  if (msg.type === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp))
  }
  if (msg.type === 'ice') {
    await pc.addIceCandidate(new RTCIceCandidate(msg.candidate))
  }
}

// ========== 发起方 ==========
document.getElementById('btn-call').onclick = async () => {
  const offer = await pc.createOffer()
  await pc.setLocalDescription(offer)
  bc.postMessage({ type: 'offer', sdp: offer.sdp })
  log('📞 Offer 已发送（去 B 标签页点"接听"）')
}

// ========== 接听方 ==========
document.getElementById('btn-answer').onclick = async () => {
  const answer = await pc.createAnswer()
  await pc.setLocalDescription(answer)
  bc.postMessage({ type: 'answer', sdp: answer.sdp })
  log('✅ Answer 已发送')
}

// ========== 挂断 ==========
document.getElementById('btn-hangup').onclick = () => {
  pc.close()
  localStream?.getTracks().forEach(t => t.stop())
  location.reload()
}
</script>
</body>
</html>
